services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: krzysiu
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mission_control
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krzysiu -d mission_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  emulator:
    build:
      context: ./emulator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://krzysiu:secretpassword@db:5432/mission_control

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://krzysiu:secretpassword@db:5432/mission_control